name: Planificateur des envois

# Tourne toutes les heures et consulte horaires.json (heure de Paris) pour
# décider quels emails envoyer. Pour changer le jour ou l'heure d'un envoi,
# modifier horaires.json — pas ce fichier.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Recap Stalling (si c'est l'heure)
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          ZAPIER_HOOK_URL: ${{ secrets.ZAPIER_HOOK_URL }}
        run: |
          rc=0; python schedule_gate.py recap_stalling || rc=$?
          if [ "$rc" = "0" ]; then
            python weekly_recap.py --send --out-dir out-stalling
          elif [ "$rc" = "2" ]; then
            exit 1
          fi

      - name: DF Frst (si c'est l'heure)
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          ZAPIER_HOOK_URL: ${{ secrets.ZAPIER_HOOK_URL }}
        run: |
          rc=0; python schedule_gate.py df_frst || rc=$?
          if [ "$rc" = "0" ]; then
            python df_frst.py --send --out-dir out-df
          elif [ "$rc" = "2" ]; then
            exit 1
          fi

      - name: Uploader les artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envois
          path: |
            out-stalling/
            out-df/
          retention-days: 7
          if-no-files-found: ignore
