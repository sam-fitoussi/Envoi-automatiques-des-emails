name: "📧 Envoyer le recap Stalling"

# Bouton d'envoi manuel : Actions → « 📧 Envoyer le recap Stalling » → Run workflow.
# Envoie immédiatement le recap Stalling aux 4 destinataires habituels,
# exactement comme le cron du lundi matin.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer et envoyer le recap
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          ZAPIER_HOOK_URL: ${{ secrets.ZAPIER_HOOK_URL }}
        run: python weekly_recap.py --send --out-dir out

      - name: Uploader l'artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap
          path: out/
          retention-days: 7
